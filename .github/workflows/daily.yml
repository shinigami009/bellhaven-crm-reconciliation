name: Daily Bellhaven reconciliation
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
jobs:
  propose-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python pipeline.py --dry-run
        env:
          BELLHAVEN_API_TOKEN: ${{ secrets.BELLHAVEN_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: reconciliation-snapshot
          path: data/runs/
